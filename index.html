<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>통닭사줘 | 2026 로보틱스 챌린지 예선 영상</title>
<meta name="description" content="부평중학교 통닭사줘 팀(S-LQB-060)의 2026 로보틱스 챌린지 문제해결트랙 예선 주행 영상">
<meta property="og:title" content="통닭사줘 | 2026 로보틱스 챌린지 예선 영상">
<meta property="og:description" content="부평중학교 통닭사줘 팀의 로봇 주행 영상">
<meta property="og:image" content="videos/run-side.jpg">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --mat: #fbfbf8;
    --line: #d5d8da;
    --tile: #e6e4df;
    --ink: #1f2428;
    --muted: #5d656b;
    --teal: #1a9fb2;
    --pink: #cf3d86;
    --yellow: #f0bf2c;
    --timer: #7657c2;
    --board: #b98b5e;
    --display: "Jua", "IBM Plex Sans KR", system-ui, sans-serif;
    --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --mat: #1c2023; --line: #353b40; --tile: #141719;
      --ink: #eef0f1; --muted: #a3abb1;
    }
  }
  * { box-sizing: border-box; }
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html, body { margin: 0; }
  body {
    background: var(--tile);
    color: var(--ink);
    font-family: var(--body);
    font-size: 1.0625rem;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  /* 경기장 매트 */
  .mat {
    max-width: 1180px;
    margin: clamp(12px, 3vw, 40px) auto;
    background:
      linear-gradient(var(--line) 2px, transparent 2px) 0 0 / 100% 33.4%,
      linear-gradient(90deg, var(--line) 2px, transparent 2px) 0 0 / 33.4% 100%,
      var(--mat);
    background-repeat: repeat;
    padding: clamp(20px, 5vw, 64px);
    border-radius: 6px;
    box-shadow: 0 1px 0 rgba(0,0,0,.06), 0 18px 40px -24px rgba(0,0,0,.35);
  }

  /* 팀 카드 (현장 이름표 모양) */
  header {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: clamp(20px, 4vw, 48px);
    align-items: end;
    margin-bottom: clamp(32px, 6vw, 64px);
  }
  .nametag {
    background: #fff;
    color: #1f2428;
    padding: 22px 30px 18px;
    border-radius: 3px;
    box-shadow: 0 2px 0 #cfd2d4, 0 10px 24px -14px rgba(0,0,0,.5);
    transform: rotate(-2.5deg);
    text-align: center;
    animation: drop .7s cubic-bezier(.2,1.4,.4,1) both;
  }
  .nametag h1 {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(2.6rem, 8vw, 4.75rem);
    line-height: 1.05;
    margin: 0;
    letter-spacing: .02em;
  }
  .nametag .code {
    font-family: var(--display);
    font-size: clamp(1.3rem, 3.5vw, 2rem);
    margin-top: 6px;
    letter-spacing: .06em;
  }
  @keyframes drop {
    from { opacity: 0; transform: translateY(-24px) rotate(-8deg); }
    to   { opacity: 1; transform: translateY(0) rotate(-2.5deg); }
  }
  @media (prefers-reduced-motion: reduce) { .nametag { animation: none; } }

  .intro h2 {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(1.5rem, 3.4vw, 2.15rem);
    line-height: 1.25;
    margin: 0 0 8px;
  }
  .intro p { margin: 0; color: var(--muted); max-width: 38em; }

  /* 부품 색 점 (경기장 위 블록) */
  .pegs { display: flex; gap: 10px; margin-bottom: 18px; }
  .pegs span { width: 14px; height: 14px; border-radius: 50%; }
  .pegs span:nth-child(1) { background: var(--yellow); }
  .pegs span:nth-child(2) { background: #3a9b4a; }
  .pegs span:nth-child(3) { background: #d6412f; }

  /* 영상 */
  .runs {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: clamp(20px, 3vw, 36px);
    align-items: start;
  }
  figure { margin: 0; }
  .frame {
    position: relative;
    background: #000;
    border-radius: 4px;
    overflow: hidden;
    border: 3px solid var(--frame, var(--teal));
  }
  .run-top .frame { --frame: var(--pink); }
  video {
    display: block;
    width: 100%;
    height: auto;
    background: #000;
  }
  figcaption {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    padding-top: 12px;
  }
  figcaption strong {
    font-family: var(--display);
    font-weight: 400;
    font-size: 1.3rem;
  }
  figcaption span { color: var(--muted); font-size: .95rem; white-space: nowrap; }

  footer {
    margin-top: clamp(40px, 7vw, 72px);
    padding-top: 20px;
    border-top: 2px solid var(--line);
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 8px 24px;
    color: var(--muted);
    font-size: .95rem;
  }
  footer .school { color: var(--ink); font-weight: 600; }

  a { color: var(--teal); }
  :focus-visible { outline: 3px solid var(--timer); outline-offset: 3px; }

  @media (max-width: 760px) {
    header { grid-template-columns: 1fr; justify-items: start; }
    .runs { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <main class="mat">
    <header>
      <div class="nametag" aria-label="팀 이름표">
        <h1>통닭사줘</h1>
        <div class="code">S-LQB-060</div>
      </div>
      <div class="intro">
        <div class="pegs" aria-hidden="true"><span></span><span></span><span></span></div>
        <h2>2026 로보틱스 챌린지<br>문제해결트랙 예선 주행</h2>
        <p>부평중학교 학생들이 직접 만들고 코딩한 로봇이 미션을 수행하는 장면입니다. 두 방향에서 촬영했어요.</p>
      </div>
    </header>

    <section class="runs" aria-label="주행 영상">
      <figure class="run-side">
        <div class="frame">
          <video controls playsinline preload="metadata" poster="videos/run-side.jpg">
            <source src="videos/run-side.mp4" type="video/mp4">
            이 브라우저에서는 영상을 재생할 수 없습니다. <a href="videos/run-side.mp4">영상 파일을 직접 열어 보세요.</a>
          </video>
        </div>
        <figcaption><strong>정면 모습</strong><span>53초</span></figcaption>
      </figure>

      <figure class="run-top">
        <div class="frame">
          <video controls playsinline preload="metadata" poster="videos/run-top.jpg">
            <source src="videos/run-top.mp4" type="video/mp4">
            이 브라우저에서는 영상을 재생할 수 없습니다. <a href="videos/run-top.mp4">영상 파일을 직접 열어 보세요.</a>
          </video>
        </div>
        <figcaption><strong>위에서 본 모습</strong><span>55초</span></figcaption>
      </figure>
    </section>

    <footer>
      <span class="school">부평중학교</span>
      <span>2026 로보틱스 챌린지 문제해결트랙 (Health Emergencies)</span>
    </footer>
  </main>
</body>
</html>
